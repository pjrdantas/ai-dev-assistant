spring:
  application:
    name: ai-dev-assistant-backend
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/?directConnection=true}
    database: ${MONGODB_DATABASE:ai_dev_assistant}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

memory:
  classification:
    full-threshold: ${MEMORY_FULL_THRESHOLD:0.90}
    partial-threshold: ${MEMORY_PARTIAL_THRESHOLD:0.70}
    maximum-full-age: ${MEMORY_MAXIMUM_FULL_AGE:180d}
  semantic-search:
    index-name: ${MEMORY_SEMANTIC_INDEX_NAME:semantic_vector_idx}
    dimension: ${MEMORY_SEMANTIC_DIMENSION:384}
    top-k: ${MEMORY_SEMANTIC_TOP_K:5}
    num-candidates: ${MEMORY_SEMANTIC_NUM_CANDIDATES:100}
    readiness-timeout: ${MEMORY_SEMANTIC_INDEX_TIMEOUT:90s}
    readiness-poll-interval: ${MEMORY_SEMANTIC_INDEX_POLL_INTERVAL:250ms}

embedding:
  local:
    enabled: ${EMBEDDING_LOCAL_ENABLED:false}
    directory: ${EMBEDDING_MODEL_DIRECTORY:models/paraphrase-multilingual-minilm}
    model-file: model.onnx
    tokenizer-file: tokenizer.json
    model-id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    model-version: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
    dimension: 384
    max-tokens: 128
    model-sha256: 98a01d88b7de996cdea58c32ca71208c09968d143798814b2ea09d3439dc334f
    tokenizer-sha256: 2c3387be76557bd40970cec13153b3bbf80407865484b209e655e5e4729076b8
    text-prefix: ""
